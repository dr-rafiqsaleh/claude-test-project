# pestbase.co.uk - the marketing website. Serves the prerendered build in
# dist/; the app itself is served separately (app.pestbase.co.uk) and nothing
# here proxies to it. The contact form posts straight to the app's API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    # Content-hashed by Vite: the bytes behind a name never change.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: /contact is dist/contact/index.html, written by the prerender step.
    # No SPA fallback - an unknown path is a real 404, with the 404 page.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html =404;
    }
}

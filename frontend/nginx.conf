# Serves the portal and proxies the API to the backend container.
#
# The point of proxying rather than pointing the browser at :8000 is that the
# portal and the API become the same origin. SuperTokens keeps its session in
# cookies; same-origin makes them first-party, so no CORS, no SameSite=None, and
# nothing to configure differently between development and production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    server_tokens off;

    # Report photos and a company logo go through here, so the default 1m would
    # reject them.
    client_max_body_size 25m;

    # Docker's embedded DNS, used deliberately with the upstream in a variable
    # rather than written literally into proxy_pass. Two failures follow from a
    # literal upstream:
    #
    #   nginx resolves it at config load and REFUSES TO START if the name does
    #   not resolve, so a backend that is down takes the whole portal with it -
    #   including the pages that need no backend at all.
    #
    #   it then caches that address for the worker's life, so after a rebuild
    #   puts the backend on a new IP every request 502s until nginx restarts.
    #
    # With a variable, resolution is deferred to request time and repeated on
    # the `valid` interval. $request_uri is required because proxy_pass with a
    # variable does not do the usual prefix substitution - it passes the
    # original URI, query string included, verbatim.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- proxied to the backend -------------------------------------------

    # `^~` matters: nginx prefers a matching regex over a plain prefix, so
    # without it the static-file regex below would claim any API path ending in
    # something that looks like an extension and answer 404 from the image
    # without the request ever reaching the backend.
    location ^~ /api {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A PDF render can take a while.
        proxy_read_timeout 120s;
    }

    # SuperTokens' own endpoints, at AUTH_API_BASE_PATH.
    #
    # This is why AUTH_WEBSITE_BASE_PATH must not also be /auth: on one origin
    # the SDK's POST /auth/signinup/code and the portal's sign-in page would be
    # the same URL, and this block would swallow the page. The portal serves its
    # sign-in UI from /login, which falls through to the SPA rule below.
    location ^~ /auth {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- served from the image --------------------------------------------

    # Content-hashed assets: the bytes behind a name never change, so a
    # year-long immutable lifetime is safe.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Anything else with an extension is a real file or genuinely missing. This
    # keeps a typo'd asset a 404 instead of silently serving index.html, which
    # would otherwise show a blank page and no clue why.
    location ~ \.[^./]+$ {
        try_files $uri =404;
    }

    # Every client-side route, including /login.
    location / {
        try_files $uri /index.html;
        # index.html must not be cached, or a browser keeps loading a build that
        # references asset names the new deployment no longer has.
        add_header Cache-Control "no-cache";
    }
}
